name: Build Windows release
on: workflow_dispatch
permissions:
  contents: write
concurrency: replik-windows-release
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
      GIT_LFS_SKIP_SMUDGE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prepare embedded runtimes and compile AccelSubs
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 missing' }
          ./build.ps1 -Compiler $iscc -BuildOnly
      - name: Verify embedded model, community pack, OCR and providers
        run: |
          & ./build/app/local/python.exe -B tests/local_engine.py build/app/local
          if ($LASTEXITCODE) {throw 'Offline engine or pack test failed'}
          $sources=(Get-Item src/*.cs,tests/Regression.cs).FullName
          $csc=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $csc /nologo /codepage:65001 /platform:x64 /target:exe /main:Replik.Regression /out:build/app/test.exe /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Net.Http.dll /r:System.Web.Extensions.dll $sources
          if ($LASTEXITCODE) {throw 'Test build failed'}
          & ./build/app/test.exe --workers --models
          if ($LASTEXITCODE) {throw 'Regression tests failed'}
      - name: Build full and upgrade installers
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ./build.ps1 -Compiler $iscc -PackageOnly -CachePatchFrom 0.2.19
      - name: Verify cache cleanup, upgrade and installed captions
        run: |
          $ErrorActionPreference='Stop'
          $old=Join-Path $env:RUNNER_TEMP 'Replik-old.exe'
          curl.exe -fsSL --retry 2 https://github.com/blackmons5/replik-altyazi/releases/download/v0.2.0/Replik-Kurulum-x64.exe -o $old
          if ($LASTEXITCODE -or (Get-FileHash $old).Hash -ne 'bc398e91fe09e8b215e121480d02b3f5a8045bb79dabe92b4828f7676173db6d') {throw 'Baseline download failed'}
          $dir=Join-Path $env:RUNNER_TEMP 'Installed Replik'
          $argsList=@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="'+$dir+'"'))
          $p=Start-Process $old -ArgumentList $argsList -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode) {throw "Baseline installation failed: $($p.ExitCode)"}
          $model=Get-Item "$dir/local/model/model.bin"
          $stamp=$model.LastWriteTimeUtc
          $quiet=@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART')
          $previous=Join-Path $env:RUNNER_TEMP 'Replik-0.2.19-update.exe'
          curl.exe -fsSL --retry 2 https://github.com/blackmons5/replik-altyazi/releases/download/v0.2.19/Replik-Guncelleme-x64-r1.exe -o $previous
          if ($LASTEXITCODE -or (Get-FileHash $previous).Hash -ne 'd2bc720df389290aa36aedbd1716e4f24070032cba30321e28b3082d5d06cb53') {throw 'Previous update download failed'}
          $p=Start-Process $previous -ArgumentList $quiet -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode) {throw "Previous update failed: $($p.ExitCode)"}
          $ocr=Get-Item "$dir/ocr/models/det.onnx"
          $ocrStamp=$ocr.LastWriteTimeUtc
          $data=Join-Path $env:LOCALAPPDATA 'Replik'
          $cache=Join-Path $data 'updates'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $settings=Join-Path $data 'paddle-ocr-settings.json'
          $settingsContent='{"Model":"PP-OCRv5_mobile","ImageStability":40,"ImageSimilarity":95,"TextDifference":3}'
          Set-Content -LiteralPath $settings -Value $settingsContent -NoNewline
          $leftovers=@(
            (Join-Path $cache ((New-Guid).ToString('N')+'.exe')),
            (Join-Path $cache ((New-Guid).ToString('N')+'.part'))
          )
          $unrelated=Join-Path $cache 'keep.exe'
          Set-Content -LiteralPath $unrelated 'unrelated'
          foreach($file in $leftovers) {
            Set-Content -LiteralPath $file 'old download'
            (Get-Item -LiteralPath $file).LastWriteTimeUtc=[DateTime]::UtcNow.AddMinutes(-3)
          }
          $cachedSetup=Join-Path $cache ((New-Guid).ToString('N')+'.exe')
          Copy-Item dist/AccelSubs-Guncelleme-1.0.31-x64.exe $cachedSetup
          $p=Start-Process $cachedSetup -ArgumentList $quiet -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode) {throw "Cache patch failed: $($p.ExitCode)"}
          $downloads=$leftovers+@($cachedSetup)
          $deadline=[DateTime]::UtcNow.AddSeconds(15)
          while(($downloads | Where-Object {Test-Path -LiteralPath $_}) -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 250
          }
          if ($downloads | Where-Object {Test-Path -LiteralPath $_}) {throw 'Update cache files remain after setup'}
          if (!(Test-Path $unrelated) -or (Get-Content -LiteralPath $settings -Raw) -ne $settingsContent) {throw 'Cleanup affected unrelated files'}
          if ((Get-Item $ocr.FullName).LastWriteTimeUtc -ne $ocrStamp) {throw 'Existing OCR model was replaced by small patch'}
          if ((Get-Item $model.FullName).LastWriteTimeUtc -ne $stamp) {throw 'Existing OPUS-MT model was replaced by small patch'}
          if ((Get-FileHash "$dir/Replik.exe").Hash -ne (Get-FileHash build/app/Replik.exe).Hash) {throw 'Small patch did not update the app'}
          Write-Host 'Cache update removed legacy, partial and active installer files and preserved settings and models.'
          $csc=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $csc /nologo /codepage:65001 /platform:x64 /target:exe "/out:$dir/InstalledCaption.exe" /r:System.Drawing.dll /r:System.Windows.Forms.dll (Get-Item tests/InstalledCaption.cs).FullName
          if ($LASTEXITCODE) {throw 'Installed application test build failed'}
          Remove-Item Env:PYTHONUTF8 -ErrorAction SilentlyContinue
          $env:OMP_THREAD_LIMIT='1'
          $patch=(Get-Item dist/Replik-Guncelleme-x64-r1.exe).FullName
          $p=Start-Process $patch -ArgumentList $quiet -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode) {throw "Upgrade failed: $($p.ExitCode)"}
          if ((Get-FileHash "$dir/Replik.exe").Hash -ne (Get-FileHash build/app/Replik.exe).Hash) {throw 'Program not updated'}
          if ((Get-Item $model.FullName).LastWriteTimeUtc -ne $stamp) {throw 'Existing model was replaced'}
          if ((Get-FileHash "$dir/local/translate.py").Hash -ne (Get-FileHash build/app/local/translate.py).Hash) {throw 'Worker not updated'}
          if (Test-Path "$dir/Tesseract.dll") {throw 'Old Tesseract DLL is still installed'}
          if (Test-Path "$dir/tessdata/eng.traineddata") {throw 'Old Tesseract model is still installed'}
          & "$dir/InstalledCaption.exe"
          if ($LASTEXITCODE) {throw 'Upgraded PaddleOCR to Turkish caption failed'}
          $fresh=Join-Path $env:RUNNER_TEMP 'Fresh AccelSubs'
          $p=Start-Process (Get-Item dist/AccelSubs-Kurulum-x64.exe).FullName -ArgumentList ($quiet+@('/DIR="'+$fresh+'"')) -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode) {throw 'Full installation failed'}
          Copy-Item "$dir/InstalledCaption.exe" $fresh
          & "$fresh/InstalledCaption.exe"
          if ($LASTEXITCODE) {throw 'Fresh PaddleOCR to Turkish caption failed'}
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $name='AccelSubs-Kurulum-x64.exe'
          $version=(Get-Content version.txt -Raw).Trim()
          $patch=Get-Item dist/Replik-Guncelleme-x64-r1.exe
          $thinPatch=Get-Item dist/AccelSubs-Guncelleme-1.0.31-x64.exe
          $file=Get-Item "dist/$name"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install --local
          git lfs track $name
          Copy-Item $file.FullName $name -Force
          git rm --ignore-unmatch -- Replik-Kurulum-x64.exe
          git add -- .gitattributes $name
          git commit -m 'Publish the AccelSubs Windows installer'
          if ($LASTEXITCODE) {throw 'Binary commit failed'}
          git push origin HEAD:master
          if ($LASTEXITCODE) {throw 'Repository installer upload failed'}
          $commit=git rev-parse HEAD
          gh release create "v$version" $file.FullName $patch.FullName $thinPatch.FullName --target $commit --title "AccelSubs $version" --notes-file release-notes.md --latest
          if ($LASTEXITCODE) {throw 'Release upload failed'}
          $tag=gh release view "v$version" --json assets | ConvertFrom-Json
          foreach($asset in @($file,$patch,$thinPatch)) {
            if (($tag.assets | Where-Object name -eq $asset.Name).digest -ne ('sha256:'+(Get-FileHash $asset.FullName).Hash)) {throw "Release checksum mismatch: $($asset.Name)"}
          }
